/**:
  ros__parameters:
    # CUDA 스트림 설정: 커널/메모리 작업의 동시성·동기화 방식
    # 0: 기본 스트림, 1: Blocking async, 2: Non-blocking async, 3: Per-thread default
    # blocking async는 ros에서 안정적으로 동작하기에 기본값으로 사용됨
    cuda_stream_type: 1

    # 전체 맵 해상도(단위 m/voxel). 값이 작을수록 맵이 촘촘하고 무거움
    voxel_size: 0.05

    # 사용 카메라(또는 센서) 개수. 멀티 카메라 융합 시 >1
    num_cameras: 1

    # TF를 사용해 센서/로봇/글로벌 프레임 간 좌표 변환을 조회할지 여부
    # 카메라 depth 센서는 camera frame 기준으로 데이터를 발행 -> /tf에서 제공되는 좌표 변환을 사용해서 센서 포인트들을 올바른 위치, 방향으로 변환후 TSDF, ESDF에 적분
    use_tf_transforms: true

    # 맵핑 유형: TSDF(연속 거리장) 또는 점유맵
    # "static_tsdf": 표준 TSDF + ESDF 파이프라인
    # "static_occupancy": 확률적 점유맵만
    mapping_type: "static_tsdf"
    global_frame: "base_link"

    # 처리 주기/주파수 설정들 — tick은 내부 스케줄러의 기준 주기(ms)
    tick_period_ms: 10                         # 스케줄러 틱 주기(ms)
    integrate_depth_rate_hz: 40.0              # Depth 프레임 적분 빈도(Hz)
    integrate_color_rate_hz: 5.0               # 컬러 텍스처 적분 빈도(Hz)

    update_mesh_rate_hz: 0.0                   # 메시 업데이트 빈도(Hz)
    update_esdf_rate_hz: 0.0                   # ESDF 업데이트 빈도(Hz), 0으로 설정시 서비스 요청시에만 업데이트
    publish_layer_rate_hz: 0.0                 # 레이어(맵) 퍼블리시 빈도(Hz), 0으로 설정시 서비스 요청시에만 업데이트

    decay_tsdf_rate_hz: 0.0                    # TSDF 감쇠(시간에 따른 신뢰도 감소) 빈도, 0으로 설정시 감쇠없음
    decay_dynamic_occupancy_rate_hz: 10.0      # 동적 객체가 존재했던 영역 감쇠 빈도
    clear_map_outside_radius_rate_hz: 0.0      # 반경 밖 맵 비우기 빈도(Hz)

    # 콘솔 출력(성능 로그·지연·드롭율 등) 설정
    print_rates_to_console: false
    print_timings_to_console: false
    print_delays_to_console: false
    print_queue_drops_to_console: false
    print_statistics_on_console_period_ms: 10000

    # ESDF 모드: 2D 슬라이스 기반 또는 3D 전체
    esdf_mode: "3d"  # ["2d", "3d"]

    # 2D 모드에서 거리 슬라이스 이미지를 퍼블리시할지 여부
    publish_esdf_distance_slice: false

    # RGB 사용 여부(컬러 텍스처/컬러 메시 생성 등)
    use_color: true

    # Depth 사용 여부(깊이 기반 통합)
    use_depth: true

    # 입력 큐(센서 메시지 버퍼) 최대 길이 — 지연·메모리 트레이드오프
    maximum_input_queue_length: 10

    # 맵 클리어링: 기준 프레임에서 주어진 반경 밖 블록을 제거
    map_clearing_radius_m: 0.0                # <0이면 비활성
    map_clearing_frame_id: "base_link"        # 반경 기준 프레임

    # 입력 QoS — ROS2 QoS 프로파일(신뢰성·히스토리 등)
    input_qos: "SENSOR_DATA"

    # RViz용 범위/슬라이스 가시화 설정(프레임/사이드 길이)
    esdf_slice_bounds_visualization_attachment_frame_id: "base_link"
    esdf_slice_bounds_visualization_side_length: 10.0
    workspace_height_bounds_visualization_attachment_frame_id: "base_link"
    workspace_height_bounds_visualization_side_length: 10.0

    # 레이어(특히 TSDF) 컬러링/필터링 옵션
    layer_visualization_min_tsdf_weight: 0.1   # 이 가중치 미만은 시각화 제외
    layer_visualization_exclusion_height_m: 2.0  # 특정 높이 이상 제외(지붕 등 제거)
    layer_visualization_exclusion_radius_m: 7.0  # 특정 반경 밖 제외
    layer_visualization_undo_gamma_correction: false # 감마 역보정 적용 여부

    # 역투영/레이캐스팅 부하 제어
    max_back_projection_distance: 7.0          # 역투영 최대 거리(m)
    back_projection_subsampling: 1             # 샘플링 간격(1=모든 픽셀)

    # 네트워크 스트리밍 대역폭 제한(Mbps). -1이면 무제한
    layer_streamer_bandwidth_limit_mbps: -1.0

    # 다중 맵퍼(멀티 카메라 병합 등) 후처리 — 작은 연결 성분 제거
    multi_mapper:
      connected_mask_component_size_threshold: 2000  # 픽셀/voxel 개수 임계
      remove_small_connected_components: true        # 임계 미만 성분 제거

    static_mapper:
      # (선처리) 깊이 노이즈 억제/홀 채우기 등의 프리프로세싱
      do_depth_preprocessing: false
      depth_preprocessing_num_dilations: 3   # 팽창 연산 횟수(홀 메움·노이즈 억제)

      # Projective Integrator: 센서 좌표계에서 TSDF/Color/Occupancy 적분
      projective_integrator_max_integration_distance_m: 5.0  # 통합 최대 거리
      projective_integrator_truncation_distance_vox: 4.0     # 트렁케이션 거리(voxel)
      projective_integrator_weighting_mode: "inverse_square_tsdf_distance_penalty" # constant도 가능
        # 관측 가중치 모델: 거리에 따른 가중치/패널티 방식
      projective_integrator_max_weight: 5.0                         # TSDF 최대 누적 가중치
      projective_tsdf_integrator_invalid_depth_decay_factor: -1.0   # 잘못된 깊이 관측에 대한 가중치 감쇠(-1: 비활성)

      # 점유맵 통합 파라미터(바이너리 확률 업데이트)
      free_region_occupancy_probability: 0.45
      occupied_region_occupancy_probability: 0.55
      unobserved_region_occupancy_probability: 0.5
      occupied_region_half_width_m: 0.1      # 점유 커널의 반경(두께) 추정치

      # View Calculator: 레이캐스팅 다운샘플링(부하 절감)
      raycast_subsampling_factor: 4

      # 작업공간 제한: 무제한/높이 제한/박스 제한
      workspace_bounds_type: "unbounded"      # ["unbounded","height_bounds","bounding_box"]
      workspace_bounds_min_corner_x_m: 0.0     # bounding_box 모드에서 사용
      workspace_bounds_min_corner_y_m: 0.0
      workspace_bounds_min_height_m: -0.5      # height_bounds 모드에서 최소 Z
      workspace_bounds_max_corner_x_m: 0.0
      workspace_bounds_max_corner_y_m: 0.0
      workspace_bounds_max_height_m: 2.0       # height_bounds 모드에서 최대 Z

      # ESDF 통합: 사이트(표면) 선택/확산 범위/최대 거리
      esdf_integrator_min_weight: 0.1          # ESDF로 반영될 최소 TSDF 가중치
      esdf_integrator_max_site_distance_vox: 2.0  # 사이트 간 최대 거리(voxel)
      esdf_integrator_max_distance_m: 2.0      # ESDF 최대 거리(잘림)

      # 메시 통합(표면 재구성)
      mesh_integrator_min_weight: 0.1          # 메시 생성에 필요한 최소 가중치
      mesh_integrator_weld_vertices: true      # 중복 정점 용접(메시 품질↑)

      # TSDF 감쇠(시계열 맵에서 오래된 관측 신뢰도 낮춤)
      tsdf_decay_factor: 0.95                  # 감쇠 계수(1.0에 가까울수록 완만)
      tsdf_decayed_weight_threshold: 0.001     # 이 가중치 미만이면 감쇠된 것으로 간주
      exclude_last_view_from_decay: true       # 최신 프레임은 감쇠 제외
      tsdf_set_free_distance_on_decayed: false # 감쇠된 셀을 자유로 설정할지 여부
      tsdf_decayed_free_distance_vox: 4.0      # 자유 거리 설정 시 사용할 값(voxel)
      decay_integrator_deallocate_decayed_blocks: true  # 감쇠된 블록 메모리 해제

      # 메시/레이어 스트리머의 시야 제외(상부/원거리 제거)
      layer_streamer_exclusion_height_m: 2.0
      layer_streamer_exclusion_radius_m: 7.0
